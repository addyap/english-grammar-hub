<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Sets the dark class before the bundle loads (no flash of the wrong theme).
         A file, not an inline script, so the CSP needs no hash for it. -->
    <script src="/theme-init.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Grammatica: English grammar, in your language. Clear rules in French, Spanish, Portuguese, Italian, German, Russian, Arabic and Mandarin Chinese."
    />
    <title>English grammar, in your language | Grammatica</title>
    <link rel="canonical" href="https://www.antonyaddy.com/grammatica" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Grammatica" />
    <meta property="og:url" content="https://www.antonyaddy.com/grammatica" />
    <meta property="og:title" content="English grammar, in your language" />
    <meta
      property="og:description"
      content="Clear rules explained in French, Spanish, Portuguese, Italian, German, Russian, Arabic and Mandarin Chinese, with self-correcting exercises."
    />
    <meta property="og:image" content="https://www.antonyaddy.com/grammatica/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="English grammar, in your language" />
    <meta
      name="twitter:description"
      content="Clear rules explained in French, Spanish, Portuguese, Italian, German, Russian, Arabic and Mandarin Chinese, with self-correcting exercises."
    />
    <meta name="twitter:image" content="https://www.antonyaddy.com/grammatica/og-image.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Grammatica",
        "url": "https://www.antonyaddy.com/grammatica",
        "description": "English grammar explained in French, Spanish, Portuguese, Italian, German, Russian, Arabic and Mandarin Chinese, with self-correcting exercises.",
        "inLanguage": "en",
        "isPartOf": { "@id": "https://www.antonyaddy.com/#website" },
        "author": { "@type": "Person", "@id": "https://www.antonyaddy.com/#antony-addy", "name": "Antony Addy", "url": "https://www.antonyaddy.com" },
        "publisher": { "@type": "ProfessionalService", "@id": "https://www.antonyaddy.com/#business", "name": "Antony Addy", "url": "https://www.antonyaddy.com" }
      }
    </script>
    <style>
      /* Page text written by scripts/prerender-heads.ts, shown until React mounts. */
      .prerender { max-width: 44rem; margin: 0 auto; padding: 4.5rem 1.25rem 3rem; font-family: Georgia, "Times New Roman", serif; line-height: 1.65; }
      .prerender h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 1rem; }
      .prerender h2 { font-size: 1.25rem; margin: 2rem 0 0.5rem; }
      .prerender li { margin: 0.35rem 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
